<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creator Earnings</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #1c242c;
        --muted: #66727f;
        --line: #d9dee5;
        --accent: #167761;
        --accent-dark: #105b4b;
        --warn: #9f5b12;
        --danger: #b42318;
        --focus: #81c8ba;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }

      .topbar-inner {
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px 20px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: center;
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
      }

      h2 {
        font-size: 15px;
        font-weight: 700;
      }

      .auth-grid {
        display: grid;
        grid-template-columns: minmax(190px, 260px) minmax(240px, 360px) auto;
        gap: 8px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      input,
      select {
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 10px;
        background: #fff;
        color: var(--ink);
        min-width: 0;
      }

      input:focus,
      select:focus,
      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 1px;
      }

      button {
        height: 38px;
        border: 0;
        border-radius: 6px;
        padding: 0 14px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button.secondary {
        background: #eef2f5;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      button.secondary:hover {
        background: #e3e8ed;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.58;
      }

      main {
        max-width: 1180px;
        width: 100%;
        margin: 0 auto;
        padding: 22px 20px 34px;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .metric,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .metric {
        padding: 14px;
        display: grid;
        gap: 4px;
        min-height: 82px;
      }

      .metric span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .metric strong {
        font-size: 20px;
        line-height: 1.2;
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 16px;
        align-items: start;
      }

      .panel-head {
        min-height: 56px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .panel-body {
        padding: 14px;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .toolbar select {
        width: 150px;
      }

      .status {
        min-height: 20px;
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .status.ok {
        color: var(--accent-dark);
      }

      .table-wrap {
        overflow: auto;
      }

      table {
        width: 100%;
        min-width: 780px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: middle;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        background: #fbfcfd;
      }

      td.amount {
        font-weight: 800;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        height: 24px;
        border-radius: 999px;
        padding: 0 9px;
        background: #edf3f1;
        color: var(--accent-dark);
        font-size: 12px;
        font-weight: 700;
        text-transform: capitalize;
      }

      .pill.processing {
        background: #eef2f7;
        color: #38506b;
      }

      .pill.failed {
        background: #fff1e3;
        color: var(--warn);
      }

      .pill.paid {
        background: #e8f6ee;
        color: #17653c;
      }

      .withdraw-form {
        display: grid;
        gap: 12px;
      }

      .selected {
        display: grid;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
      }

      .selected-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .selected-row span {
        color: var(--muted);
      }

      .bank-preview {
        min-height: 48px;
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfd;
      }

      .bank-preview img {
        width: 42px;
        height: 42px;
        object-fit: contain;
      }

      .bank-preview strong,
      .bank-preview span {
        display: block;
      }

      .bank-preview span {
        color: var(--muted);
        font-size: 12px;
      }

      .empty {
        padding: 36px 14px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 920px) {
        .topbar-inner,
        .content-grid,
        .auth-grid {
          grid-template-columns: 1fr;
        }

        .summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        main,
        .topbar-inner {
          padding-left: 14px;
          padding-right: 14px;
        }

        .summary {
          grid-template-columns: 1fr;
        }

        .panel-head {
          align-items: stretch;
          flex-direction: column;
        }

        .toolbar {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="topbar-inner">
          <h1>Creator Earnings</h1>
          <form class="auth-grid" id="auth-form">
            <label>
              API base
              <input id="api-base" name="api-base" autocomplete="url" />
            </label>
            <label>
              Access token
              <input id="access-token" name="access-token" type="password" autocomplete="off" />
            </label>
            <button type="submit">Refresh</button>
          </form>
        </div>
      </header>

      <main>
        <section class="summary" aria-label="Earnings summary">
          <div class="metric">
            <span>Available</span>
            <strong id="metric-available">0 VND</strong>
          </div>
          <div class="metric">
            <span>Processing</span>
            <strong id="metric-processing">0 VND</strong>
          </div>
          <div class="metric">
            <span>Paid</span>
            <strong id="metric-paid">0 VND</strong>
          </div>
          <div class="metric">
            <span>Total earned</span>
            <strong id="metric-total">0 VND</strong>
          </div>
        </section>

        <section class="content-grid">
          <div class="panel">
            <div class="panel-head">
              <h2>Earnings</h2>
              <div class="toolbar">
                <select id="status-filter" aria-label="Filter by status">
                  <option value="all">All statuses</option>
                  <option value="pending">Pending</option>
                  <option value="processing">Processing</option>
                  <option value="paid">Paid</option>
                  <option value="failed">Failed</option>
                </select>
                <button class="secondary" id="reload" type="button">Reload</button>
              </div>
            </div>
            <div class="status" id="page-status" role="status"></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Month</th>
                    <th>Amount</th>
                    <th>Learners</th>
                    <th>Score</th>
                    <th>Status</th>
                    <th>Payout state</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="earnings-body"></tbody>
              </table>
            </div>
            <div class="empty" id="empty-state" hidden>No earnings found.</div>
          </div>

          <aside class="panel">
            <div class="panel-head">
              <h2>Withdrawal</h2>
            </div>
            <div class="panel-body">
              <form class="withdraw-form" id="withdraw-form">
                <div class="selected" id="selected-earning">
                  <div class="selected-row">
                    <span>Selected</span>
                    <strong id="selected-month">None</strong>
                  </div>
                  <div class="selected-row">
                    <span>Amount</span>
                    <strong id="selected-amount">0 VND</strong>
                  </div>
                </div>
                <label>
                  Bank
                  <input id="bank-search" name="bank-search" list="bank-options" autocomplete="off" placeholder="Search bank name, code, or BIN" required />
                  <datalist id="bank-options"></datalist>
                </label>
                <div class="bank-preview" id="bank-preview" hidden>
                  <img id="bank-logo" alt="" />
                  <div>
                    <strong id="bank-title"></strong>
                    <span id="bank-meta"></span>
                  </div>
                </div>
                <label>
                  Account number
                  <input id="to-account-number" name="to-account-number" autocomplete="off" required />
                </label>
                <label>
                  Account name
                  <input id="to-account-name" name="to-account-name" autocomplete="name" />
                </label>
                <label>
                  Amount (VND)
                  <input id="withdraw-amount" name="withdraw-amount" type="number" min="100001" step="1000" required />
                </label>
                <label>
                  Description
                  <input id="description" name="description" maxlength="140" />
                </label>
                <button class="secondary" id="save-account" type="button">Save payout account</button>
                <button id="withdraw-submit" type="submit" disabled>Submit withdrawal</button>
                <div class="status" id="withdraw-status" role="status"></div>
              </form>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <script>
      const MIN_WITHDRAWAL_VND = 100000;
      const state = {
        apiBase: localStorage.getItem("mempan_api_base") || "http://localhost",
        token: localStorage.getItem("access_token") || localStorage.getItem("mempan_access_token") || "",
        earnings: [],
        banks: [],
        payoutAccount: null,
        selected: null,
        loading: false,
      };

      const els = {
        apiBase: document.querySelector("#api-base"),
        token: document.querySelector("#access-token"),
        authForm: document.querySelector("#auth-form"),
        body: document.querySelector("#earnings-body"),
        empty: document.querySelector("#empty-state"),
        pageStatus: document.querySelector("#page-status"),
        filter: document.querySelector("#status-filter"),
        reload: document.querySelector("#reload"),
        withdrawForm: document.querySelector("#withdraw-form"),
        withdrawSubmit: document.querySelector("#withdraw-submit"),
        withdrawStatus: document.querySelector("#withdraw-status"),
        selectedMonth: document.querySelector("#selected-month"),
        selectedAmount: document.querySelector("#selected-amount"),
        bankSearch: document.querySelector("#bank-search"),
        bankOptions: document.querySelector("#bank-options"),
        bankPreview: document.querySelector("#bank-preview"),
        bankLogo: document.querySelector("#bank-logo"),
        bankTitle: document.querySelector("#bank-title"),
        bankMeta: document.querySelector("#bank-meta"),
        toAccountNumber: document.querySelector("#to-account-number"),
        toAccountName: document.querySelector("#to-account-name"),
        description: document.querySelector("#description"),
        withdrawAmount: document.querySelector("#withdraw-amount"),
        saveAccount: document.querySelector("#save-account"),
        metrics: {
          available: document.querySelector("#metric-available"),
          processing: document.querySelector("#metric-processing"),
          paid: document.querySelector("#metric-paid"),
          total: document.querySelector("#metric-total"),
        },
      };

      els.apiBase.value = state.apiBase;
      els.token.value = state.token;

      function formatMoney(value) {
        return new Intl.NumberFormat("vi-VN", {
          style: "currency",
          currency: "VND",
          maximumFractionDigits: 0,
        }).format(Number(value || 0));
      }

      function formatMonth(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat("en", { month: "short", year: "numeric" }).format(date);
      }

      function nullableValue(value) {
        if (value && typeof value === "object") {
          if ("Valid" in value && !value.Valid) return "";
          if ("String" in value) return value.String || "";
          if ("Time" in value) return value.Time || "";
        }
        return value || "";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function setStatus(target, message, kind = "") {
        target.textContent = message;
        target.className = `status ${kind}`.trim();
      }

      function eligibleForWithdrawal(earning) {
        return ["pending", "failed"].includes(earning.status) && Number(earning.amount_vnd) > MIN_WITHDRAWAL_VND;
      }

      function renderSummary() {
        const totals = state.earnings.reduce(
          (acc, item) => {
            const amount = Number(item.amount_vnd || 0);
            acc.total += amount;
            if (eligibleForWithdrawal(item)) acc.available += amount;
            if (item.status === "processing") acc.processing += amount;
            if (item.status === "paid") acc.paid += amount;
            return acc;
          },
          { available: 0, processing: 0, paid: 0, total: 0 }
        );

        els.metrics.available.textContent = formatMoney(totals.available);
        els.metrics.processing.textContent = formatMoney(totals.processing);
        els.metrics.paid.textContent = formatMoney(totals.paid);
        els.metrics.total.textContent = formatMoney(totals.total);
      }

      function renderSelection() {
        if (!state.selected) {
          els.selectedMonth.textContent = "None";
          els.selectedAmount.textContent = formatMoney(0);
          els.withdrawAmount.value = "";
          els.withdrawSubmit.disabled = true;
          return;
        }
        els.selectedMonth.textContent = formatMonth(state.selected.pool_month);
        els.selectedAmount.textContent = formatMoney(state.selected.amount_vnd);
        if (!els.withdrawAmount.value) {
          els.withdrawAmount.value = String(state.selected.amount_vnd || 0);
        }
        els.withdrawSubmit.disabled = state.loading || !eligibleForWithdrawal(state.selected);
      }

      function selectedBank() {
        const value = els.bankSearch.value.trim().toLowerCase();
        return (
          state.banks.find((bank) => bank.label.toLowerCase() === value) ||
          state.banks.find((bank) => bank.bin.toLowerCase() === value) ||
          state.banks.find((bank) => bank.code.toLowerCase() === value) ||
          state.banks.find((bank) => bank.shortName.toLowerCase() === value) ||
          null
        );
      }

      function renderBanks() {
        els.bankOptions.innerHTML = "";
        els.bankSearch.placeholder = state.banks.length ? "Search bank name, code, or BIN" : "No banks loaded";

        for (const bank of state.banks) {
          const option = document.createElement("option");
          option.value = bank.label;
          els.bankOptions.appendChild(option);
        }

        if (state.payoutAccount?.bank_bin) {
          const saved = state.banks.find((bank) => bank.bin === state.payoutAccount.bank_bin);
          els.bankSearch.value = saved?.label || state.payoutAccount.bank_short_name || state.payoutAccount.bank_name || state.payoutAccount.bank_bin;
        }
        renderBankPreview();
      }

      function renderBankPreview() {
        const bank = selectedBank();
        els.bankPreview.hidden = !bank;
        if (!bank) return;
        els.bankLogo.src = bank.logo || "";
        els.bankLogo.hidden = !bank.logo;
        els.bankTitle.textContent = `${bank.shortName} (${bank.bin})`;
        els.bankMeta.textContent = bank.name;
      }

      function renderTable() {
        const filter = els.filter.value;
        const rows = state.earnings.filter((item) => filter === "all" || item.status === filter);

        els.body.innerHTML = "";
        els.empty.hidden = rows.length !== 0;

        for (const earning of rows) {
          const tr = document.createElement("tr");
          const payoutState = nullableValue(earning.payos_payout_state) || nullableValue(earning.payout_failed_reason) || "-";
          const canWithdraw = eligibleForWithdrawal(earning);
          tr.innerHTML = `
            <td>${formatMonth(earning.pool_month)}</td>
            <td class="amount">${formatMoney(earning.amount_vnd)}</td>
            <td>${escapeHtml(earning.eligible_learners ?? 0)}</td>
            <td>${escapeHtml(earning.weighted_score ?? "0")}</td>
            <td><span class="pill ${escapeHtml(earning.status)}">${escapeHtml(earning.status)}</span></td>
            <td>${escapeHtml(payoutState)}</td>
            <td><button class="secondary" type="button" data-earning-id="${escapeHtml(earning.earning_id)}" ${canWithdraw ? "" : "disabled"}>Withdraw</button></td>
          `;
          els.body.appendChild(tr);
        }

        renderSummary();
        renderSelection();
      }

      async function apiFetch(path, options = {}) {
        const base = state.apiBase.replace(/\/+$/, "");
        const headers = {
          Accept: "application/json",
          Authorization: `Bearer ${state.token}`,
          ...(options.body ? { "Content-Type": "application/json" } : {}),
        };
        const response = await fetch(`${base}${path}`, { ...options, headers });
        const text = await response.text();
        const data = text ? JSON.parse(text) : null;
        if (!response.ok) {
          throw new Error(data?.error || `Request failed with HTTP ${response.status}`);
        }
        return data;
      }

      async function loadBanks() {
        try {
          state.apiBase = els.apiBase.value.trim() || state.apiBase || "http://localhost";
          const base = state.apiBase.replace(/\/+$/, "");
          const response = await fetch(`${base}/v1/billing/banks`, { headers: { Accept: "application/json" } });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const payload = await response.json();
          state.banks = (payload.data || [])
            .filter((bank) => bank.transfer_supported === true || bank.transferSupported === 1)
            .map((bank) => ({
              bin: String(bank.bin || ""),
              code: String(bank.code || ""),
              shortName: String(bank.short_name || bank.shortName || ""),
              name: String(bank.name || ""),
              logo: String(bank.logo || ""),
            }))
            .filter((bank) => bank.bin && bank.code && bank.shortName && bank.name)
            .map((bank) => ({
              ...bank,
              label: `${bank.shortName} - ${bank.name} (${bank.bin})`,
            }));
          renderBanks();
        } catch (err) {
          els.bankSearch.placeholder = "Unable to load banks";
          setStatus(els.withdrawStatus, "Unable to load bank list from backend.", "error");
        }
      }

      async function loadPayoutAccount() {
        try {
          state.payoutAccount = await apiFetch("/v1/creators/me/payout-account");
          els.toAccountNumber.value = state.payoutAccount.account_number || "";
          els.toAccountName.value = state.payoutAccount.account_name || "";
          renderBanks();
        } catch (err) {
          if (!err.message.includes("not found")) {
            setStatus(els.withdrawStatus, err.message, "error");
          }
        }
      }

      async function loadEarnings() {
        state.apiBase = els.apiBase.value.trim() || "http://localhost";
        state.token = els.token.value.trim();
        localStorage.setItem("mempan_api_base", state.apiBase);
        if (state.token) localStorage.setItem("mempan_access_token", state.token);

        if (!state.token) {
          setStatus(els.pageStatus, "Access token is required.", "error");
          return;
        }

        state.loading = true;
        renderSelection();
        setStatus(els.pageStatus, "Loading earnings...");
        try {
          const [earnings] = await Promise.all([apiFetch("/v1/creators/me/earnings"), loadPayoutAccount()]);
          state.earnings = earnings;
          state.selected = state.earnings.find(eligibleForWithdrawal) || null;
          renderTable();
          setStatus(els.pageStatus, `Loaded ${state.earnings.length} earning record${state.earnings.length === 1 ? "" : "s"}.`, "ok");
        } catch (err) {
          setStatus(els.pageStatus, err.message, "error");
        } finally {
          state.loading = false;
          renderSelection();
        }
      }

      async function savePayoutAccount() {
        const bank = selectedBank();
        if (!bank) {
          setStatus(els.withdrawStatus, "Select a bank before saving payout account.", "error");
          return false;
        }
        setStatus(els.withdrawStatus, "Saving payout account...");
        try {
          state.payoutAccount = await apiFetch("/v1/creators/me/payout-account", {
            method: "PUT",
            body: JSON.stringify({
              bank_bin: bank.bin,
              bank_code: bank.code,
              bank_short_name: bank.shortName,
              bank_name: bank.name,
              bank_logo: bank.logo,
              account_number: els.toAccountNumber.value.trim(),
              account_name: els.toAccountName.value.trim(),
            }),
          });
          setStatus(els.withdrawStatus, "Payout account saved.", "ok");
          return true;
        } catch (err) {
          setStatus(els.withdrawStatus, err.message, "error");
          return false;
        }
      }

      async function submitWithdrawal(event) {
        event.preventDefault();
        if (!state.selected || !eligibleForWithdrawal(state.selected)) return;
        const amountVND = Number(els.withdrawAmount.value || 0);
        if (amountVND <= MIN_WITHDRAWAL_VND) {
          setStatus(els.withdrawStatus, `Withdrawal amount must be over ${MIN_WITHDRAWAL_VND.toLocaleString("vi-VN")} VND.`, "error");
          return;
        }

        state.loading = true;
        renderSelection();
        const accountSaved = await savePayoutAccount();
        if (!accountSaved) {
          state.loading = false;
          renderSelection();
          return;
        }
        setStatus(els.withdrawStatus, "Submitting withdrawal...");
        try {
          const result = await apiFetch("/v1/creators/me/withdrawals", {
            method: "POST",
            body: JSON.stringify({
              amount_vnd: amountVND,
              description: els.description.value.trim(),
              category: ["creator_payout"],
            }),
          });
          await loadEarnings();
          setStatus(els.withdrawStatus, "Withdrawal submitted.", "ok");
        } catch (err) {
          setStatus(els.withdrawStatus, err.message, "error");
        } finally {
          state.loading = false;
          renderSelection();
        }
      }

      els.authForm.addEventListener("submit", (event) => {
        event.preventDefault();
        loadEarnings();
      });
      els.reload.addEventListener("click", loadEarnings);
      els.filter.addEventListener("change", renderTable);
      els.bankSearch.addEventListener("input", renderBankPreview);
      els.saveAccount.addEventListener("click", savePayoutAccount);
      els.withdrawForm.addEventListener("submit", submitWithdrawal);
      els.body.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-earning-id]");
        if (!button) return;
        state.selected = state.earnings.find((item) => item.earning_id === button.dataset.earningId) || null;
        if (state.selected) {
          els.withdrawAmount.value = String(state.selected.amount_vnd || 0);
        }
        setStatus(els.withdrawStatus, "");
        renderSelection();
      });

      renderTable();
      loadBanks();
      if (state.token) loadEarnings();
    </script>
  </body>
</html>
