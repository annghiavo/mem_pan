swagger: "2.0"
info:
  title: mempan-api
  description: Unified gateway for mem_pan microservices on Cloud Run
  version: 1.0.0
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json

# Each "prefix → backend" group below uses {path=**} so any depth of path
# under that prefix is forwarded to the matching Cloud Run service. The
# path_translation: APPEND_PATH_TO_ADDRESS means the full request path is
# appended to the backend host, so /v1/auth/login lands at
# auth-service/v1/auth/login.
paths:
  # ─── auth-service ───────────────────────────────────────────────────────
  /v1/auth/{path=**}:
    parameters:
      - in: path
        name: path
        required: true
        type: string
    get: &auth_op
      operationId: authGet
      x-google-backend:
        disable_auth: true
        address: https://auth-service-wzed7v5hbq-as.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 30.0
      responses:
        '200':
          description: ok
    post:
      operationId: authPost
      x-google-backend:
        disable_auth: true
        address: https://auth-service-wzed7v5hbq-as.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 30.0
      responses:
        '200':
          description: ok
    patch:
      operationId: authPatch
      x-google-backend:
        disable_auth: true
        address: https://auth-service-wzed7v5hbq-as.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 30.0
      responses:
        '200':
          description: ok
    delete:
      operationId: authDelete
      x-google-backend:
        disable_auth: true
        address: https://auth-service-wzed7v5hbq-as.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
        deadline: 30.0
