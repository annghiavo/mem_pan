services:
  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8000:80"
      - "8090:8080" # Traefik dashboard: http://localhost:8090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gateway
    restart: unless-stopped

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    expose:
      - "8085"
    networks:
      - gateway
    restart: unless-stopped

  pubsub-setup:
    image: curlimages/curl:latest
    depends_on:
      - pubsub-emulator
      - stats-service
      - notification-service
      - search-service
      - admin-service
      - moderation-service
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_PUSH_SECRET=dev-secret
      - STATS_SERVICE_HOST=stats-service:8084
      - NOTIFICATION_SERVICE_HOST=notification-service:8085
      - SEARCH_SERVICE_HOST=search-service:8086
      - ADMIN_SERVICE_HOST=admin-service:8083
      - MODERATION_SERVICE_HOST=moderation-service:8087
    volumes:
      - ./pubsub-setup:/scripts:ro
    entrypoint: sh /scripts/init.sh
    networks:
      - gateway
    restart: on-failure

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    env_file:
      - ../services/auth-service/app.env
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_TOPIC=user-events
    depends_on:
      - pubsub-emulator
    expose:
      - "8080"
      - "9090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.rule=PathPrefix(`/v1/auth`) || PathPrefix(`/v1/users`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"
    networks:
      - gateway
    restart: unless-stopped

  deck-service:
    build:
      context: ..
      dockerfile: services/deck-service/Dockerfile
    env_file:
      - ../services/deck-service/app.env
    environment:
      - AUTH_SERVICE_ADDRESS=auth-service:9090
      - STUDY_SERVICE_ADDRESS=study-service:9092
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_TOPIC=deck-events
    depends_on:
      - auth-service
      - pubsub-emulator
    expose:
      - "8081"
      - "9091"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deck.entrypoints=web"
      - "traefik.http.routers.deck.rule=PathPrefix(`/v1/decks`) || PathPrefix(`/v1/folders`) || PathPrefix(`/v1/cards`) || PathPrefix(`/v1/import`)"
      - "traefik.http.services.deck.loadbalancer.server.port=8081"
    networks:
      - gateway
    restart: unless-stopped

  study-service:
    build:
      context: ..
      dockerfile: services/study-service/Dockerfile
    env_file:
      - ../services/study-service/app.env
    environment:
      - AUTH_SERVICE_ADDRESS=auth-service:9090
      - DECK_SERVICE_ADDRESS=deck-service:9091
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_TOPIC=study-events
    depends_on:
      - auth-service
      - deck-service
      - pubsub-emulator
    expose:
      - "8082"
      - "9092"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.study.entrypoints=web"
      - "traefik.http.routers.study.rule=PathPrefix(`/v1/study`)"
      - "traefik.http.services.study.loadbalancer.server.port=8082"
    networks:
      - gateway
    restart: unless-stopped

  admin-service:
    build:
      context: ..
      dockerfile: services/admin-service/Dockerfile
    env_file:
      - ../services/admin-service/app.env
    environment:
      - AUTH_SERVICE_ADDRESS=auth-service:9090
      - NOTIFICATION_SERVICE_ADDRESS=notification-service:9095
      - DECK_SERVICE_ADDRESS=deck-service:9091
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_TOPIC=report-events
    depends_on:
      - auth-service
      - notification-service
      - deck-service
      - pubsub-emulator
    expose:
      - "8083"
      - "9093"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.routers.admin.rule=PathPrefix(`/v1/admin`)"
      - "traefik.http.services.admin.loadbalancer.server.port=8083"
    networks:
      - gateway
    restart: unless-stopped

  stats-service:
    build:
      context: ..
      dockerfile: services/stats-service/Dockerfile
    env_file:
      - ../services/stats-service/app.env
    environment:
      - AUTH_SERVICE_ADDRESS=auth-service:9090
    depends_on:
      - auth-service
    expose:
      - "8084"
      - "9094"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stats.entrypoints=web"
      - "traefik.http.routers.stats.rule=PathPrefix(`/v1/stats`)"
      - "traefik.http.services.stats.loadbalancer.server.port=8084"
    networks:
      - gateway
    restart: unless-stopped

  search-service:
    build:
      context: ..
      dockerfile: services/search-service/Dockerfile
    env_file:
      - ../services/search-service/app.env
    environment:
      - AUTH_SERVICE_ADDRESS=auth-service:9090
      - PUBSUB_PUSH_SECRET=dev-secret
    depends_on:
      - auth-service
      - pubsub-emulator
    expose:
      - "8086"
      - "9096"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.search.entrypoints=web"
      - "traefik.http.routers.search.rule=PathPrefix(`/v1/search`)"
      - "traefik.http.services.search.loadbalancer.server.port=8086"
    networks:
      - gateway
    restart: unless-stopped

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    env_file:
      - ../services/notification-service/app.env
    environment:
      - AUTH_SERVICE_ADDRESS=auth-service:9090
      - STATS_SERVICE_ADDRESS=stats-service:9094
      - STUDY_SERVICE_ADDRESS=study-service:9092
      - PUBSUB_PUSH_SECRET=dev-secret
    volumes:
      - ../services/notification-service/mempan-cac51-firebase-adminsdk-fbsvc-fc301037a8.json:/fcm-credentials.json:ro
    depends_on:
      - auth-service
      - stats-service
      - study-service
      - pubsub-emulator
    expose:
      - "8085"
      - "9095"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notification.entrypoints=web"
      - "traefik.http.routers.notification.rule=PathPrefix(`/v1/notifications`)"
      - "traefik.http.services.notification.loadbalancer.server.port=8085"
    networks:
      - gateway
    restart: unless-stopped

  moderation-service:
    build:
      context: ../services/moderation-fsrs-service
      dockerfile: Dockerfile
    environment:
      - GRPC_PORT=50051
      - HTTP_PORT=8087
      - TEXT_MODEL_DIR=/models/flashcard_text_moderator
      - IMAGE_MODEL_DIR=/models/flashcard_image_moderator
      - DECK_SERVICE_ADDR=deck-service:9091
      - NOTIFICATION_SERVICE_ADDR=notification-service:9095
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_MODERATION_TOPIC=moderation-events
      - PUBSUB_PUSH_SECRET=dev-secret
    volumes:
      # Mount the model weights from the host so the docker image stays small
      # and re-trains don't require an image rebuild.
      - ../ml_model/results/flashcard_text_moderator:/models/flashcard_text_moderator:ro
      - ../ml_model/results/flashcard_image_moderator:/models/flashcard_image_moderator:ro
    depends_on:
      - deck-service
      - notification-service
      - pubsub-emulator
    expose:
      - "8087"   # HTTP (Pub/Sub push receiver + healthz + /metrics)
      - "50051"  # gRPC (ModerateDeck + OptimizeWeights)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moderation.entrypoints=web"
      - "traefik.http.routers.moderation.rule=PathPrefix(`/internal/moderation`)"
      - "traefik.http.services.moderation.loadbalancer.server.port=8087"
    networks:
      - gateway
    restart: unless-stopped

networks:
  gateway:
    driver: bridge
