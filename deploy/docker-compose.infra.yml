# Run alongside docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.infra.yml up
#
# This file adds the Pub/Sub emulator and wires up the push subscriptions.
# It also injects PUBSUB_* env vars into the publisher services so they
# can reach the emulator.

services:
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    expose:
      - "8085"
    networks:
      - gateway
    restart: unless-stopped

  pubsub-setup:
    image: curlimages/curl:latest
    depends_on:
      - pubsub-emulator
      - stats-service
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_PUSH_SECRET=dev-secret
      - STATS_SERVICE_HOST=stats-service:8084
    volumes:
      - ./pubsub-setup:/scripts:ro
    entrypoint: sh /scripts/init.sh
    networks:
      - gateway
    restart: on-failure

  # Override publisher services to inject Pub/Sub emulator config.
  auth-service:
    depends_on:
      - pubsub-emulator
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_TOPIC=user-events

  deck-service:
    depends_on:
      - pubsub-emulator
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_TOPIC=deck-events

  study-service:
    depends_on:
      - pubsub-emulator
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_TOPIC=study-events

  admin-service:
    depends_on:
      - pubsub-emulator
    environment:
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - PUBSUB_PROJECT_ID=local-dev
      - PUBSUB_TOPIC=report-events

networks:
  gateway:
