name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'pkg/**'
      - 'proto/**'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26.2'
  GOLANGCI_LINT_VERSION: 'v1.62.2'
  SQLC_VERSION: '1.27.0'
  PROTOC_VERSION: '27.3'
  MIGRATE_VERSION: 'v4.19.1'

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Lint runs once across every service module. golangci-lint-action
  #    auto-detects each go.mod and uses Go's own module cache.
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.work.sum
            services/*/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m --config=.golangci.yml
          working-directory: .

  # ─────────────────────────────────────────────────────────────────────
  # 2. Verify codegen — fail the build if proto/sqlc/mock generation
  #    produces a diff (i.e. a dev forgot to commit *.pb.go or *.sql.go).
  # ─────────────────────────────────────────────────────────────────────
  verify-codegen:
    name: Verify codegen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.work.sum
            services/*/go.sum

      - name: Install protoc
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@latest

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest

      - name: Regenerate proto, sqlc, mocks for every service
        run: |
          set -euo pipefail
          for svc_dir in services/*/; do
            svc=$(basename "$svc_dir")
            echo "::group::regen $svc"
            if [ -f "$svc_dir/Makefile" ]; then
              # proto
              if grep -q "^proto:" "$svc_dir/Makefile"; then
                (cd "$svc_dir" && make proto) || true
              fi
              # sqlc
              if [ -d "$svc_dir/db" ] && [ -f "$svc_dir/db/sqlc.yaml" -o -f "$svc_dir/sqlc.yaml" ]; then
                (cd "$svc_dir/db" && sqlc generate)
              fi
              # mocks
              if [ -d "$svc_dir/internal/mock" ]; then
                (cd "$svc_dir" && GOWORK=off go generate ./...) || true
              fi
            fi
            echo "::endgroup::"
          done

      - name: Fail if generated files drift from committed
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated code is out of sync. Run 'make proto && make sqlc && go generate ./...' locally and commit."
            git diff
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────
  # 3. Test matrix — one job per service. Each service is its own Go
  #    module, so per-module testing parallelises cleanly and isolates
  #    failures. Integration tests run under `-tags=integration` against
  #    sidecar containers (Postgres for repo tests, ES + Pub/Sub emulator
  #    for services that need them).
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, verify-codegen]
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - auth-service
          - deck-service
          - moderation-fsrs-service
          - notification-service
          - search-service
          - stats-service
          - study-service

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        options: >-
          --health-cmd "curl -fs http://localhost:9200 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

      # The Pub/Sub emulator image needs a custom command, which GHA service
      # containers cannot supply (only `options` are passed to docker create
      # and the image's ENTRYPOINT can't be overridden cleanly). Tests that
      # need it should spin it up via testcontainers-go inside the test.

    env:
      ELASTICSEARCH_URL: http://localhost:9200
      PUBSUB_PROJECT_ID: local-dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Run unit tests (race + coverage)
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: 'off'  # use per-module go.mod, ignore workspace.
        run: |
          go test -v -race -shuffle=on \
            -coverprofile=coverage.txt -covermode=atomic \
            ./...

      - name: Run integration tests (testcontainers + tagged files)
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: 'off'
          TESTCONTAINERS_RYUK_DISABLED: 'true'  # Ryuk doesn't play well with GHA runners
        run: |
          # Only run integration tests if the package opts in via build tag.
          if grep -rqsE "^//go:build (integration|.*[ ,]integration)" --include='*_test.go' .; then
            go test -v -race -tags=integration -timeout=10m \
              -coverprofile=coverage-integration.txt -covermode=atomic \
              ./...
          else
            echo "No integration-tagged tests in this service; skipping."
          fi

      - name: Merge coverage
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f coverage-integration.txt ]; then
            # Drop the duplicated `mode:` header before concat
            tail -n +2 coverage-integration.txt >> coverage.txt
          fi
          # Strip codegen + mock noise so the % reflects hand-written code.
          grep -vE '/(pb|internal/db|internal/mock)/' coverage.txt > coverage.filtered.txt \
            || cp coverage.txt coverage.filtered.txt
          mv coverage.filtered.txt coverage.txt
          go tool cover -func=coverage.txt | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.txt
          retention-days: 14

      - name: Detect Codecov token
        id: codecov_token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Codecov
        if: steps.codecov_token.outputs.present == 'true'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/${{ matrix.service }}/coverage.txt
          flags: ${{ matrix.service }}
          fail_ci_if_error: false
