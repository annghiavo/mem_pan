syntax = "proto3";

package study;

import "study_models.proto";

option go_package = "mem_pan/services/study-service/pb";

message StartSessionRequest {
    string deck_id          = 1;
    optional int32 new_cards_limit  = 2;
    optional int32 review_limit     = 3;
}

message StartSessionResponse {
    StudySession session = 1;
}

message GetSessionRequest {
    string session_id = 1;
}

message GetSessionResponse {
    StudySession session = 1;
}

message ReviewCardRequest {
    string session_id  = 1;
    string card_id     = 2;
    int32  rating      = 3;
    int32  duration_ms = 4;
    // IANA timezone of the device at review time. Optional but recommended —
    // used for streak boundary and activity-histogram bucketing.
    string timezone    = 5;
}

message ReviewCardResponse {
    UserCardState user_card = 1;
}

message FinishSessionRequest {
    string session_id = 1;
}

message FinishSessionResponse {
    StudySession session = 1;
}

message GetDueCardsRequest {
    string deck_id = 1;
}

message GetDueCardsResponse {
    repeated DueCard cards = 1;
    int32            total = 2;
}

message GetRecentSessionCardsRequest {}

message GetRecentSessionCardsResponse {
    StudySession session = 1;
}

message GetRecentDecksRequest {}

message GetRecentDecksResponse {
    repeated RecentDeckItem decks = 1;
}

message GetDeckProgressRequest {
    string deck_id = 1;
}

message GetStudyDeckSettingsRequest {
    string deck_id = 1;
}

message GetStudyDeckSettingsResponse {
    StudySettings settings = 1;
}

message UpdateStudyDeckSettingsRequest {
    string        deck_id  = 1;
    StudySettings settings = 2;
}

message UpdateStudyDeckSettingsResponse {
    StudySettings settings = 1;
}

message CheckAnswerRequest {
    string deck_id        = 1;
    string user_answer    = 2;
    string correct_answer = 3;
}

message CheckAnswerResponse {
    bool  is_correct = 1;
    float score      = 2;
}
