syntax = "proto3";

package study;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "rpc_study.proto";
import "study_models.proto";

option go_package = "mem_pan/services/study-service/pb";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
    info: {
        title: "Study Service API";
        version: "1.0";
    };
    security_definitions: {
        security: {
            key: "BearerAuth";
            value: {
                type: TYPE_API_KEY;
                in: IN_HEADER;
                name: "Authorization";
            };
        };
    };
    consumes: "application/json";
    produces: "application/json";
};

service StudyService {
    rpc StartSession (StartSessionRequest) returns (StartSessionResponse) {
        option (google.api.http) = { post: "/v1/study/sessions"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Start a study session for a deck"; tags: "study";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc GetSession (GetSessionRequest) returns (GetSessionResponse) {
        option (google.api.http) = { get: "/v1/study/sessions/{session_id}" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get session status and card queue"; tags: "study";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc ReviewCard (ReviewCardRequest) returns (ReviewCardResponse) {
        option (google.api.http) = { post: "/v1/study/sessions/{session_id}/review"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Submit rating (1-4) for a card and compute FSRS"; tags: "study";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc FinishSession (FinishSessionRequest) returns (FinishSessionResponse) {
        option (google.api.http) = { post: "/v1/study/sessions/{session_id}/finish"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Finish a study session"; tags: "study";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc GetDueCards (GetDueCardsRequest) returns (GetDueCardsResponse) {
        option (google.api.http) = { get: "/v1/study/due" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "List cards due today across all decks or by deck (pass deck_id query param)"; tags: "study";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc GetRecentSessionCards (GetRecentSessionCardsRequest) returns (GetRecentSessionCardsResponse) {
        option (google.api.http) = { get: "/v1/study/sessions/recent/cards" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get card list from the most recently studied session"; tags: "study";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc GetRecentDecks (GetRecentDecksRequest) returns (GetRecentDecksResponse) {
        option (google.api.http) = { get: "/v1/study/decks/recent" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get list of recently studied decks ordered by last access"; tags: "study";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc GetDeckProgress (GetDeckProgressRequest) returns (DeckProgressResponse) {
        option (google.api.http) = { get: "/v1/study/decks/{deck_id}/progress" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get card progress counts for a deck (new/studying/memorized)"; tags: "study";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc GetDeckSettings (GetStudyDeckSettingsRequest) returns (GetStudyDeckSettingsResponse) {
        option (google.api.http) = { get: "/v1/study/decks/{deck_id}/settings" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get study settings for a deck"; tags: "study";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc UpdateDeckSettings (UpdateStudyDeckSettingsRequest) returns (UpdateStudyDeckSettingsResponse) {
        option (google.api.http) = { put: "/v1/study/decks/{deck_id}/settings"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Update study settings for a deck"; tags: "study";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc CheckAnswer (CheckAnswerRequest) returns (CheckAnswerResponse) {
        option (google.api.http) = { post: "/v1/study/decks/{deck_id}/check-answer"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Check a written answer against the correct answer using deck grading settings"; tags: "study";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    // Internal-only. Returns the number of cards whose next_review_date <= the
    // end of today in the given IANA timezone, for a single user. Used by
    // notification-service reminder crons.
    rpc CountDueForUser (CountDueForUserRequest) returns (CountDueForUserResponse);

    // Internal-only. Returns the number of distinct users who have ever started
    // a study session on the deck (deck owner included). Used by deck-service
    // to show a learner count on the deck detail page.
    rpc CountDeckLearners (CountDeckLearnersRequest) returns (CountDeckLearnersResponse);

    // Internal-only. Ranks decks by distinct learners active within the last
    // window_days days (trending). deck-service filters the result down to
    // public decks for the "top public decks" leaderboard.
    rpc TopDecksByLearners (TopDecksByLearnersRequest) returns (TopDecksByLearnersResponse);
}

message CountDueForUserRequest {
    string user_id  = 1;
    string timezone = 2;  // IANA name, e.g. "Asia/Ho_Chi_Minh"
}

message CountDueForUserResponse {
    int32 due_today = 1;
}

message CountDeckLearnersRequest {
    string deck_id = 1;
}

message CountDeckLearnersResponse {
    int64 count = 1;
}

message TopDecksByLearnersRequest {
    int32 window_days = 1; // trending window; <=0 falls back to 7 days
    int32 limit       = 2; // max rows; <=0 falls back to 10, capped at 100
}

message DeckLearners {
    string deck_id  = 1;
    int64  learners = 2;
}

message TopDecksByLearnersResponse {
    repeated DeckLearners decks = 1;
}
