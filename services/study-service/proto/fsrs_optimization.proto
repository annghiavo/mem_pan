syntax = "proto3";

// Mirror of moderation-fsrs-service's FsrsOptimizationService so study-service
// (a separate Go module) can dial it as a gRPC client. The proto `package` MUST
// stay identical to the server's — gRPC routes by `/<package>.<Service>/<Method>`,
// so a mismatch would surface as Unimplemented. Keep field numbers in sync with
// services/moderation-fsrs-service/proto/moderation_fsrs.proto.
package mem_pan.moderation_fsrs.v1;

option go_package = "mem_pan/services/study-service/pb";

service FsrsOptimizationService {
  // study-service -> Python: re-tune the 21 FSRS weights for one user.
  rpc OptimizeWeights(OptimizeWeightsRequest) returns (OptimizeWeightsResponse);
}

message ReviewLog {
  string card_id      = 1;
  int64  review_date  = 2;   // unix seconds
  int32  rating       = 3;   // 1..4
  int32  elapsed_days = 4;
}

message OptimizeWeightsRequest {
  string user_id = 1;
  repeated ReviewLog review_logs = 2;
}

message OptimizeWeightsResponse {
  string user_id = 1;
  repeated float weights = 2;       // 17 / 19 / 21 floats depending on fsrs version
  int32  num_reviews_used = 3;
  float  loss = 4;
  string fsrs_version = 5;
}
