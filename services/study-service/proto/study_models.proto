syntax = "proto3";

package study;

import "google/protobuf/timestamp.proto";

option go_package = "mem_pan/services/study-service/pb";

message UserCardState {
    string                    user_card_id     = 1;
    string                    user_id          = 2;
    string                    card_id          = 3;
    string                    deck_id          = 4;
    string                    state            = 5;
    double                    stability        = 6;
    double                    difficulty       = 7;
    int32                     reps             = 8;
    int32                     lapses           = 9;
    int32                     scheduled_days   = 10;
    google.protobuf.Timestamp next_review_date = 11;
    google.protobuf.Timestamp last_review_date = 12;
}

message SessionCardItem {
    int32  position     = 1;
    string card_id      = 2;
    string user_card_id = 3;
    bool   reviewed     = 4;
    int32  rating       = 5;
}

message StudySession {
    string                    session_id       = 1;
    string                    user_id          = 2;
    string                    deck_id          = 3;
    string                    status           = 4;
    int32                     total_cards      = 5;
    int32                     completed_cards  = 6;
    repeated SessionCardItem  cards            = 7;
    google.protobuf.Timestamp started_at       = 8;
    google.protobuf.Timestamp finished_at      = 9;
}

message DueCard {
    string                    card_id          = 1;
    string                    deck_id          = 2;
    string                    user_card_id     = 3;
    string                    state            = 4;
    google.protobuf.Timestamp next_review_date = 5;
}

message RecentDeckItem {
    string                    deck_id          = 1;
    google.protobuf.Timestamp last_accessed_at = 2;
}

message ProgressTag {
    string          label    = 1;
    int32           count    = 2;
    repeated string card_ids = 3;
}

message DeckProgressResponse {
    string deck_id         = 1;
    int32  new_count       = 2;
    int32  learn_count     = 3;
    int32  memorized_count = 4;
    int32  total_count     = 5;
    repeated ProgressTag tags = 6;
    // Soonest next_review_date among the user's non-new cards in this deck.
    // Unset when the deck has no scheduled (non-new) cards yet. The client
    // renders the countdown from this absolute timestamp.
    google.protobuf.Timestamp next_review_date = 7;
    // Number of non-new cards already due (next_review_date <= now).
    int32 due_now = 8;
}

message StudySettings {
    bool   shuffle_terms                   = 1;
    bool   text_to_speech                  = 2;
    bool   answer_with_term                = 3;
    bool   answer_with_definition          = 4;
    bool   question_type_flashcards        = 5;
    bool   question_type_multiple_choice   = 6;
    bool   question_type_written           = 7;
    string strictness_level                = 8;
    bool   require_retyping_correct_answer = 9;
    int32  new_card_limit                  = 10;
    int32  review_card_limit               = 11;
}
