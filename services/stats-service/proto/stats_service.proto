syntax = "proto3";

package stats;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "mem_pan/services/stats-service/pb";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
    info: {
        title: "Stats Service API";
        version: "1.0";
    };
    security_definitions: {
        security: {
            key: "BearerAuth";
            value: {
                type: TYPE_API_KEY;
                in: IN_HEADER;
                name: "Authorization";
            };
        };
    };
    consumes: "application/json";
    produces: "application/json";
};

service StatsService {
    rpc GetMyStats(GetMyStatsRequest) returns (GetMyStatsResponse) {
        option (google.api.http) = { get: "/v1/stats/me" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get current user overall stats"; tags: "stats";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc GetHeatmap(GetHeatmapRequest) returns (GetHeatmapResponse) {
        option (google.api.http) = { get: "/v1/stats/me/heatmap" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get daily study heatmap for a date range"; tags: "stats";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc GetDeckStats(GetDeckStatsRequest) returns (GetDeckStatsResponse) {
        option (google.api.http) = { get: "/v1/stats/decks/{deck_id}" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get stats for a specific deck"; tags: "stats";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc ListMyDeckStats(ListMyDeckStatsRequest) returns (ListMyDeckStatsResponse) {
        option (google.api.http) = { get: "/v1/stats/me/decks" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "List stats for all decks owned by the current user"; tags: "stats";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc GetDeckProgress(GetDeckProgressRequest) returns (GetDeckProgressResponse) {
        option (google.api.http) = { get: "/v1/stats/decks/{deck_id}/progress" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get deck card-state progress timeline"; tags: "stats";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    // Internal-only — called by notification-service from cron handlers.
    // Returns reminder state for every user (current_streak, last_studied_date,
    // optimal_hour_*, reminder_local_time). Server-to-server only — auth via
    // INTERNAL_SHARED_SECRET header.
    rpc ListReminderState(ListReminderStateRequest) returns (ListReminderStateResponse);
}

// ── Reminder state (internal) ──────────────────────────────────────────────────

message UserReminderState {
    string user_id              = 1;
    int32  current_streak       = 2;
    string last_studied_date    = 3;  // YYYY-MM-DD or "" if never
    int32  optimal_hour_weekday = 4;  // 0-23, -1 if unset
    int32  optimal_hour_weekend = 5;  // 0-23, -1 if unset
    string reminder_local_time  = 6;  // HH:MM (24h), default "21:00"
}

message ListReminderStateRequest {
    // If true, return only users with current_streak >= 1 (streak-warning cron).
    bool only_active_streak = 1;
}

message ListReminderStateResponse {
    repeated UserReminderState users = 1;
}

// ── Messages ─────────────────────────────────────────────────────────────────

message UserStats {
    string user_id             = 1;
    int32  total_cards         = 2;
    int32  total_reviews       = 3;
    int64  total_study_time_ms = 4;
    int32  current_streak      = 5;
    int32  longest_streak      = 6;
    string last_studied_date   = 7;
    int32  total_correct       = 8;
    int32  total_incorrect     = 9;
    string username            = 10;
    string avatar_url          = 11;
    string updated_at          = 12;
}

message GetMyStatsRequest {
    string timezone = 1;
}
message GetMyStatsResponse {
    UserStats stats = 1;
}

// ── Heatmap ───────────────────────────────────────────────────────────────────

message DailyStatEntry {
    string study_date      = 1;
    int32  reviews_count   = 2;
    int32  new_cards_count = 3;
    int64  study_time_ms   = 4;
    int32  correct_count   = 5;
}

message GetHeatmapRequest {
    string from_date = 1;
    string to_date   = 2;
}

message GetHeatmapResponse {
    repeated DailyStatEntry entries = 1;
}

// ── Deck stats ────────────────────────────────────────────────────────────────

message DeckStat {
    string deck_id        = 1;
    string user_id        = 2;
    int32  total_cards    = 3;
    int32  new_cards      = 4;
    int32  learning_cards = 5;
    int32  review_cards   = 6;
    int32  mastered_cards = 7;
    int32  due_today      = 8;
    string deck_name      = 9;
    string updated_at     = 10;
}

message GetDeckStatsRequest {
    string deck_id = 1;
}

message GetDeckStatsResponse {
    DeckStat stats = 1;
}

message ListMyDeckStatsRequest {}

message ListMyDeckStatsResponse {
    repeated DeckStat decks = 1;
}

// ── Deck progress ─────────────────────────────────────────────────────────────

message DeckProgressEntry {
    string snapshot_date  = 1;
    int32  new_count      = 2;
    int32  learning_count = 3;
    int32  review_count   = 4;
    int32  mastered_count = 5;
}

message GetDeckProgressRequest {
    string deck_id    = 1;
    string from_date  = 2;
    string to_date    = 3;
}

message GetDeckProgressResponse {
    repeated DeckProgressEntry entries = 1;
}
