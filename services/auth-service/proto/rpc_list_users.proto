syntax = "proto3";

package pb;

option go_package = "mem_pan/services/auth-service/pb";

message ListUsersRequest {
    int32 page_size     = 1;
    int32 offset        = 2;
    bool  filter_banned = 3;
}

message ListUsersResponse {
    repeated AdminUser users = 1;
    int64              total = 2;
}

message AdminUser {
    string user_id    = 1;
    string username   = 2;
    string email      = 3;
    string role       = 4;
    bool   is_banned  = 5;
    string created_at = 6;
}
