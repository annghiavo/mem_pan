syntax = "proto3";

package admin;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "mem_pan/services/admin-service/pb";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
    info: {
        title: "Admin Service API";
        version: "1.0";
    };
    security_definitions: {
        security: {
            key: "BearerAuth";
            value: {
                type: TYPE_API_KEY;
                in: IN_HEADER;
                name: "Authorization";
            };
        };
    };
    consumes: "application/json";
    produces: "application/json";
};

service AdminService {
    // Reports (admin)
    rpc ListReports (ListReportsRequest) returns (ListReportsResponse) {
        option (google.api.http) = { get: "/v1/admin/reports" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] See list of reports"; tags: "admin";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc ProcessReport (ProcessReportRequest) returns (ProcessReportResponse) {
        option (google.api.http) = { patch: "/v1/admin/reports/{report_id}"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Report processing (resolve/dismiss)"; tags: "admin";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    // Users
    rpc ListUsers (ListUsersRequest) returns (ListUsersResponse) {
        option (google.api.http) = { get: "/v1/admin/users" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] List of users, filter banned"; tags: "admin";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc BanUser (BanUserRequest) returns (BanUserResponse) {
        option (google.api.http) = { patch: "/v1/admin/users/{user_id}/ban"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Ban/unban user"; tags: "admin";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    // Decks
    rpc ListDecks (ListDecksRequest) returns (ListDecksResponse) {
        option (google.api.http) = { get: "/v1/admin/decks" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] List all decks (filter by status)"; tags: "admin";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc UpdateDeckStatus (UpdateDeckStatusRequest) returns (UpdateDeckStatusResponse) {
        option (google.api.http) = { patch: "/v1/admin/decks/{deck_id}/status"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Hide or delete the offending deck (cascades to cards)"; tags: "admin";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    // Moderator management (admin only)
    rpc PromoteModerator (PromoteModeratorRequest) returns (PromoteModeratorResponse) {
        option (google.api.http) = { post: "/v1/admin/users/promote-moderator"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Promote a user to moderator by email"; tags: "admin";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    // ----- Email templates (admin only) -----

    rpc ListEmailTemplates (ListEmailTemplatesRequest) returns (ListEmailTemplatesResponse) {
        option (google.api.http) = { get: "/v1/admin/email-templates" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] List email templates"; tags: "admin-email-templates";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc GetEmailTemplate (GetEmailTemplateRequest) returns (EmailTemplate) {
        option (google.api.http) = { get: "/v1/admin/email-templates/{template_key}" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Get email template"; tags: "admin-email-templates";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc UpdateEmailTemplate (UpdateEmailTemplateRequest) returns (EmailTemplate) {
        option (google.api.http) = { put: "/v1/admin/email-templates/{template_key}"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Update email template content"; tags: "admin-email-templates";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc PreviewEmailTemplate (PreviewEmailTemplateRequest) returns (PreviewEmailTemplateResponse) {
        option (google.api.http) = { post: "/v1/admin/email-templates/{template_key}:preview"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Render email template preview"; tags: "admin-email-templates";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc SendTestEmail (SendTestEmailRequest) returns (SendTestEmailResponse) {
        option (google.api.http) = { post: "/v1/admin/email-templates/{template_key}:test"; body: "*" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Send a test email using a template"; tags: "admin-email-templates";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }
}

// Message definitions
message Report {
    string report_id       = 1;
    string reporter_id     = 2;
    string target_type     = 3;   // user | deck
    string target_id       = 4;
    string reason_category = 5;
    string description     = 6;
    string status          = 7;   // pending | resolved | dismissed
    string admin_note      = 8;
    string resolution      = 9;   // banned | deck_hidden | deck_deleted | "" (when dismissed)
    string resolved_by     = 10;
    string resolved_at     = 11;
    string created_at      = 12;
    string updated_at      = 13;
}

message ListReportsRequest {
    int32  page_size     = 1;
    string page_token    = 2;
    string status_filter = 3;   // "", pending, resolved, dismissed
}

message ListReportsResponse {
    repeated Report reports         = 1;
    string          next_page_token = 2;
}

message ProcessReportRequest {
    string report_id  = 1;
    string action     = 2;  // ban_user | hide_deck | delete_deck | dismiss
    string admin_note = 3;
}

message ProcessReportResponse {
    Report report            = 1;
    int32  affected_reports  = 2;  // total reports bulk-resolved for the same target
    int32  notified_reporters = 3; // unique reporters notified
}

message User {
    string id = 1;
    string username = 2;
    string email = 3;
    bool is_banned = 4;
    string created_at = 5;
}

message ListUsersRequest {
    int32 page_size = 1;
    string page_token = 2;
    bool filter_banned = 3;
}

message ListUsersResponse {
    repeated User users = 1;
    string next_page_token = 2;
}

message BanUserRequest {
    string user_id = 1;
    bool ban = 2; // true to ban, false to unban
    string reason = 3;
}

message BanUserResponse {
    User user = 1;
}

message UpdateDeckStatusRequest {
    string deck_id = 1;
    string status = 2; // "hidden", "deleted", "active"
    string reason = 3;
}

message UpdateDeckStatusResponse {
    string deck_id = 1;
    string status = 2;
}

message AdminDeck {
    string deck_id    = 1;
    string user_id    = 2;
    string name       = 3;
    string description = 4;
    bool   is_public  = 5;
    string status     = 6;
    int32  card_count = 7;
    string created_at = 8;
    string updated_at = 9;
}

message ListDecksRequest {
    int32  page_size     = 1;
    string page_token    = 2;
    string status_filter = 3; // "", "active", "hidden", "deleted"
}

message ListDecksResponse {
    repeated AdminDeck decks         = 1;
    string             next_page_token = 2;
    int64              total          = 3;
}


message PromoteModeratorRequest {
    string email = 1;
}

message PromoteModeratorResponse {
    string user_id   = 1;
    string email     = 2;
    string username  = 3;
}

message EmailTemplate {
    string id            = 1;
    string template_key  = 2;
    string locale        = 3;
    string subject       = 4;
    string html_body     = 5;
    string text_body     = 6;
    repeated string variables = 7;
    bool   is_active     = 8;
    int32  version       = 9;
    string updated_by    = 10;
    string created_at    = 11;
    string updated_at    = 12;
}

message ListEmailTemplatesRequest {}
message ListEmailTemplatesResponse {
    repeated EmailTemplate templates = 1;
}

message GetEmailTemplateRequest {
    string template_key = 1;
    string locale       = 2;
}

message UpdateEmailTemplateRequest {
    string template_key = 1;
    string locale       = 2;
    string subject      = 3;
    string html_body    = 4;
    string text_body    = 5;
}

message PreviewEmailTemplateRequest {
    string template_key      = 1;
    string locale            = 2;
    map<string,string> data  = 3;
}

message PreviewEmailTemplateResponse {
    string subject   = 1;
    string html_body = 2;
    string text_body = 3;
}

message SendTestEmailRequest {
    string template_key      = 1;
    string locale            = 2;
    string to                = 3;
    map<string,string> data  = 4;
}

message SendTestEmailResponse {
    string message = 1;
}
