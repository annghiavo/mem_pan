syntax = "proto3";

package notification;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "mem_pan/services/notification-service/pb";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
    info: {
        title: "Notification Service API";
        version: "1.0";
    };
    security_definitions: {
        security: {
            key: "BearerAuth";
            value: {
                type: TYPE_API_KEY;
                in: IN_HEADER;
                name: "Authorization";
            };
        };
    };
    consumes: "application/json";
    produces: "application/json";
};

service NotificationService {
    // Register a device FCM token for push notifications.
    rpc RegisterDeviceToken(RegisterDeviceTokenRequest) returns (RegisterDeviceTokenResponse) {
        option (google.api.http) = {
            post: "/v1/notifications/devices"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Register a device FCM token";
            tags: "notifications";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    // Unregister a device FCM token.
    rpc UnregisterDeviceToken(UnregisterDeviceTokenRequest) returns (UnregisterDeviceTokenResponse) {
        option (google.api.http) = {
            delete: "/v1/notifications/devices/{token}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Unregister a device FCM token";
            tags: "notifications";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    // Send a test push to the caller's registered devices (or to an explicit
    // token). Bypasses the scheduler's time-window / due-count / dedup gating
    // so it can be triggered on demand from the Android app or a dev tool.
    rpc SendTestNotification(SendTestNotificationRequest) returns (SendTestNotificationResponse) {
        option (google.api.http) = {
            post: "/v1/notifications/devices:test"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Send a test push to the caller's devices";
            tags: "notifications";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    // ----- Admin: email templates -----

    rpc ListEmailTemplates(ListEmailTemplatesRequest) returns (ListEmailTemplatesResponse) {
        option (google.api.http) = { get: "/v1/notifications/admin/email-templates" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] List all email templates";
            tags: "admin-email-templates";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc GetEmailTemplate(GetEmailTemplateRequest) returns (EmailTemplate) {
        option (google.api.http) = { get: "/v1/notifications/admin/email-templates/{template_key}" };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Get one email template";
            tags: "admin-email-templates";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc UpdateEmailTemplate(UpdateEmailTemplateRequest) returns (EmailTemplate) {
        option (google.api.http) = {
            put: "/v1/notifications/admin/email-templates/{template_key}"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Update an email template";
            tags: "admin-email-templates";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc PreviewEmailTemplate(PreviewEmailTemplateRequest) returns (PreviewEmailTemplateResponse) {
        option (google.api.http) = {
            post: "/v1/notifications/admin/email-templates/{template_key}:preview"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Render a template with sample data";
            tags: "admin-email-templates";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    rpc SendTestEmail(SendTestEmailRequest) returns (SendTestEmailResponse) {
        option (google.api.http) = {
            post: "/v1/notifications/admin/email-templates/{template_key}:test"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "[Admin] Send a rendered template to a test address";
            tags: "admin-email-templates";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }
}

message RegisterDeviceTokenRequest {
    string token       = 1;
    string device_name = 2;
}

message RegisterDeviceTokenResponse {
    string message = 1;
}

message UnregisterDeviceTokenRequest {
    string token = 1;
}

message UnregisterDeviceTokenResponse {}

message SendTestNotificationRequest {
    // "study_reminder" (default) or "streak_warning". Controls title + body
    // copy and the `type` field in the data payload — matches what the cron
    // produces in production.
    string notification_type = 1;

    // Optional. If empty, the push is sent to ALL FCM tokens registered for
    // the caller. If set, sent only to this token (useful before the device is
    // registered, or for ad-hoc QA on someone else's handset).
    string token = 2;

    // Fake values used to render the body. Defaults: due_count=5, streak=0.
    int32  due_count = 3;
    int32  streak    = 4;
}

message SendTestNotificationResponse {
    int32  device_count = 1; // how many tokens we attempted to send to
    string title        = 2; // echo of the rendered title
    string body         = 3; // echo of the rendered body
}

message EmailTemplate {
    string id            = 1;
    string template_key  = 2;
    string locale        = 3;
    string subject       = 4;
    string html_body     = 5;
    string text_body     = 6;
    repeated string variables = 7;
    bool   is_active     = 8;
    int32  version       = 9;
    string updated_by    = 10;
    string created_at    = 11;
    string updated_at    = 12;
}

message ListEmailTemplatesRequest {}
message ListEmailTemplatesResponse {
    repeated EmailTemplate templates = 1;
}

message GetEmailTemplateRequest {
    string template_key = 1;
    string locale       = 2;
}

message UpdateEmailTemplateRequest {
    string template_key = 1;
    string locale       = 2;
    string subject      = 3;
    string html_body    = 4;
    string text_body    = 5;
}

message PreviewEmailTemplateRequest {
    string template_key      = 1;
    string locale            = 2;
    map<string,string> data  = 3;
}

message PreviewEmailTemplateResponse {
    string subject   = 1;
    string html_body = 2;
    string text_body = 3;
}

message SendTestEmailRequest {
    string template_key      = 1;
    string locale            = 2;
    string to                = 3;
    map<string,string> data  = 4;
}

message SendTestEmailResponse {
    string message = 1;
}
