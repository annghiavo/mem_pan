syntax = "proto3";

package notification;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "mem_pan/services/notification-service/pb";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
    info: {
        title: "Notification Service API";
        version: "1.0";
    };
    security_definitions: {
        security: {
            key: "BearerAuth";
            value: {
                type: TYPE_API_KEY;
                in: IN_HEADER;
                name: "Authorization";
            };
        };
    };
    consumes: "application/json";
    produces: "application/json";
};

service NotificationService {
    // Register a device FCM token for push notifications.
    rpc RegisterDeviceToken(RegisterDeviceTokenRequest) returns (RegisterDeviceTokenResponse) {
        option (google.api.http) = {
            post: "/v1/notifications/devices"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Register a device FCM token";
            tags: "notifications";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }

    // Unregister a device FCM token.
    rpc UnregisterDeviceToken(UnregisterDeviceTokenRequest) returns (UnregisterDeviceTokenResponse) {
        option (google.api.http) = {
            delete: "/v1/notifications/devices/{token}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Unregister a device FCM token";
            tags: "notifications";
            security: { security_requirement: { key: "BearerAuth"; value: {} } };
        };
    }
}

message RegisterDeviceTokenRequest {
    string token       = 1;
    string device_name = 2;
}

message RegisterDeviceTokenResponse {
    string message = 1;
}

message UnregisterDeviceTokenRequest {
    string token = 1;
}

message UnregisterDeviceTokenResponse {}
