syntax = "proto3";

package pb;

option go_package = "mem_pan/services/deck-service/pb";

message AdminUpdateDeckStatusRequest {
    string deck_id = 1;
    string status  = 2; // active | hidden | deleted
}

message AdminUpdateDeckStatusResponse {
    string deck_id = 1;
    string status  = 2;
    string user_id = 3;
    string name    = 4;
}

message AdminDeckRecord {
    string deck_id     = 1;
    string user_id     = 2;
    string name        = 3;
    string description = 4;
    bool   is_public   = 5;
    string status      = 6;
    int32  card_count  = 7;
    string created_at  = 8;
    string updated_at  = 9;
}

message AdminListDecksRequest {
    int32  page_size     = 1;
    int32  offset        = 2;
    string status_filter = 3; // "", "active", "hidden", "deleted"
}

message AdminListDecksResponse {
    repeated AdminDeckRecord decks = 1;
    int64                    total = 2;
}
